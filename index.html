<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Terranova German Lernen</title>
    <script data-goatcounter="https://paulacavalcanti.goatcounter.com/count"
        async src="//gc.zgo.at/count.js"></script>
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🇩🇪</text></svg>">
    
    <!-- PWA Meta Tags & Icons -->
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#4f46e5">
    <link rel="apple-touch-icon" href="icon-192.svg">

    <style>
        :root {
            --primary: #4f46e5;
            --primary-hover: #4338ca;
            --bg: #f3f4f6;
            --card-bg: #ffffff;
            --text: #1f2937;
            --border: #e5e7eb;
            --success: #10b981;
        }
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: var(--bg);
            color: var(--text);
            margin: 0;
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
            box-sizing: border-box;
        }
        .container {
            width: 100%;
            max-width: 600px;
            background: var(--card-bg);
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 6px -1px rgb(0 0 0 / 0.1);
            box-sizing: border-box;
        }
        h1 {
            margin-top: 0;
            font-size: 1.8rem;
            text-align: center;
            color: var(--primary);
        }
        .tabs {
            display: flex;
            justify-content: center;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn, .cat-btn {
            padding: 8px 16px;
            border: none;
            background: var(--border);
            color: var(--text);
            font-weight: 600;
            border-radius: 8px;
            cursor: pointer;
            transition: all 0.2s;
            font-size: 0.9rem;
        }
        .tab-btn.active, .cat-btn.active {
            background: var(--primary);
            color: white;
        }
        .category-container {
            display: flex;
            justify-content: center;
            gap: 8px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }
        .mode-section {
            display: none;
        }
        .mode-section.active {
            display: block;
        }
        /* Flashcard Styles */
        .flashcard-container {
            perspective: 1000px;
            width: 100%;
            height: 250px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        .flashcard {
            width: 100%;
            height: 100%;
            position: relative;
            transform-style: preserve-3d;
            transition: transform 0.6s;
            border-radius: 12px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.08);
        }
        .flashcard.flipped {
            transform: rotateY(180deg);
        }
        .card-face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            border-radius: 12px;
            padding: 20px;
            box-sizing: border-box;
            font-size: 1.5rem;
            text-align: center;
        }
        .card-front {
            background: #ffffff;
            color: var(--text);
            border: 2px solid var(--border);
        }
        .card-back {
            background: var(--primary);
            color: white;
            transform: rotateY(180deg);
        }
        .card-label {
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.7;
            margin-bottom: 10px;
        }
        .controls {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 10px;
            margin-bottom: 15px;
        }
        .jump-container {
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            padding-top: 10px;
            border-top: 1px solid var(--border);
        }
        .jump-input {
            width: 80px;
            padding: 8px;
            border: 2px solid var(--border);
            border-radius: 8px;
            text-align: center;
            font-size: 1rem;
            font-weight: 600;
        }
        .jump-input:focus {
            outline: none;
            border-color: var(--primary);
        }
        button.action-btn, a.action-btn {
            padding: 10px 20px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 8px;
            font-weight: 600;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            text-align: center;
            box-sizing: border-box;
        }
        button.action-btn:hover, a.action-btn:hover {
            background: var(--primary-hover);
        }
        /* Matching Game Styles */
        .matching-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }
        .match-card {
            background: white;
            border: 2px solid var(--border);
            padding: 12px 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            font-size: 1rem;
            font-weight: 500;
            transition: all 0.2s;
            min-height: 50px;
            display: flex;
            align-items: center;
            justify-content: center;
            word-break: break-word;
        }
        .match-card:hover {
            border-color: var(--primary);
        }
        .match-card.selected {
            background: #e0e7ff;
            border-color: var(--primary);
            color: var(--primary);
        }
        .match-card.matched {
            background: #d1fae5;
            border-color: var(--success);
            color: #065f46;
            cursor: default;
            opacity: 0.6;
        }
        .stats {
            text-align: center;
            margin-bottom: 15px;
            font-weight: 600;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Terranova German Lernen</h1>
        
        <!-- Navigation Link Button -->
        <div style="text-align: center; margin-bottom: 20px;">
            <a href="https://terranovaeng.github.io/HighFrequency/" class="action-btn">High Frequency Deck</a>
        </div>
        
        <!-- Category Filter Buttons -->
        <div class="category-container">
            <button class="cat-btn active" onclick="filterCategory('All')">All Decks</button>
            <button class="cat-btn" onclick="filterCategory('Briefmarken')">Briefmarken</button>
            <button class="cat-btn" onclick="filterCategory('Abstrakte Konzepte')">Abstrakte Konzepte</button>
        </div>

        <!-- Mode Tabs -->
        <div class="tabs">
            <button class="tab-btn active" onclick="switchTab('flashcards')">Flashcards</button>
            <button class="tab-btn" onclick="switchTab('matching')">Matching Game</button>
        </div>

        <!-- Flashcard Mode -->
        <div id="flashcards-section" class="mode-section active">
            <div class="stats" id="card-counter">Card 1 of 0</div>
            <div class="flashcard-container" onclick="flipCard()">
                <div class="flashcard" id="flashcard">
                    <div class="card-face card-front">
                        <div class="card-label">German</div>
                        <div id="front-text">Loading...</div>
                    </div>
                    <div class="card-face card-back">
                        <div class="card-label">English</div>
                        <div id="back-text">Loading...</div>
                    </div>
                </div>
            </div>
            <div class="controls">
                <button class="action-btn" onclick="prevCard()">Previous</button>
                <button class="action-btn" onclick="randomCard()">Random</button>
                <button class="action-btn" onclick="nextCard()">Next</button>
            </div>
            <div class="jump-container">
                <label for="jump-input" style="font-size: 0.9rem; font-weight: 600;">Go to card:</label>
                <input type="number" id="jump-input" class="jump-input" min="1" placeholder="200">
                <button class="action-btn" onclick="jumpToCard()">Go</button>
            </div>
        </div>

        <!-- Matching Game Mode -->
        <div id="matching-section" class="mode-section">
            <div class="stats">Match German words with their English translations!</div>
            <div style="text-align: center; margin-bottom: 15px;">
                <button class="action-btn" onclick="initMatchingGame()">New Round</button>
            </div>
            <div class="matching-grid" id="matching-grid"></div>
        </div>
    </div>

    <script>
        // Register Service Worker for PWA Offline Support
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('sw.js')
                    .then(reg => console.log('Service Worker registered!', reg))
                    .catch(err => console.log('Service Worker registration failed:', err));
            });
        }

        let allCards = [];
        let cards = [];
        let currentIndex = 0;
        let isFlipped = false;
        let currentCategory = 'All';

        async function loadData() {
            try {
                const response = await fetch('flashcards.json');
                allCards = await response.json();
                filterCategory('All');
            } catch (e) {
                document.getElementById('front-text').innerText = "Error loading flashcards.json";
            }
        }

        function filterCategory(cat) {
            currentCategory = cat;
            document.querySelectorAll('.cat-btn').forEach(b => {
                if (b.innerText.includes(cat) || (cat === 'All' && b.innerText.includes('All'))) {
                    b.classList.add('active');
                } else {
                    b.classList.remove('active');
                }
            });

            cards = cat === 'All' ? allCards : allCards.filter(c => c.category === cat);
            currentIndex = 0;
            updateCard();
            initMatchingGame();
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.mode-section').forEach(s => s.classList.remove('active'));
            if (tab === 'flashcards') {
                document.querySelector('button[onclick*="flashcards"]').classList.add('active');
                document.getElementById('flashcards-section').classList.add('active');
            } else {
                document.querySelector('button[onclick*="matching"]').classList.add('active');
                document.getElementById('matching-section').classList.add('active');
            }
        }

        function updateCard() {
            if (cards.length === 0) {
                document.getElementById('front-text').innerText = "No cards in this category";
                document.getElementById('back-text').innerText = "No cards";
                document.getElementById('card-counter').innerText = "Card 0 of 0";
                return;
            }
            isFlipped = false;
            document.getElementById('flashcard').classList.remove('flipped');
            document.getElementById('front-text').innerText = cards[currentIndex].german;
            document.getElementById('back-text').innerText = cards[currentIndex].english;
            document.getElementById('card-counter').innerText = `Card ${currentIndex + 1} of ${cards.length}`;
            document.getElementById('jump-input').max = cards.length;
        }

        function flipCard() {
            isFlipped = !isFlipped;
            document.getElementById('flashcard').classList.toggle('flipped', isFlipped);
        }

        function nextCard() {
            if (cards.length === 0) return;
            currentIndex = (currentIndex + 1) % cards.length;
            updateCard();
        }

        function prevCard() {
            if (cards.length === 0) return;
            currentIndex = (currentIndex - 1 + cards.length) % cards.length;
            updateCard();
        }

        function randomCard() {
            if (cards.length === 0) return;
            currentIndex = Math.floor(Math.random() * cards.length);
            updateCard();
        }

        function jumpToCard() {
            if (cards.length === 0) return;
            const inputVal = parseInt(document.getElementById('jump-input').value, 10);
            
            if (isNaN(inputVal)) return;

            // Convert 1-based user numbering to 0-based index (clamp between 1 and total cards)
            const targetIndex = Math.max(1, Math.min(inputVal, cards.length)) - 1;
            currentIndex = targetIndex;
            updateCard();
        }

        let selectedElement = null;

        function initMatchingGame() {
            if (!cards || cards.length === 0) return;
            const grid = document.getElementById('matching-grid');
            grid.innerHTML = '';
            
            const validCards = cards.filter(item => 
                item && 
                item.german && 
                item.english && 
                item.german.trim() !== "" && 
                item.english.trim() !== ""
            );
            
            if (validCards.length < 4) {
                grid.innerHTML = `<div style="grid-column: span 2; text-align: center; color: red;">Not enough valid translation pairs in this category.</div>`;
                return;
            }

            let shuffled = [...validCards].sort(() => 0.5 - Math.random());
            let roundCards = shuffled.slice(0, 4);

            let gameTiles = [];
            roundCards.forEach((item, index) => {
                gameTiles.push({ text: item.german.trim(), pairId: index, type: 'german' });
                gameTiles.push({ text: item.english.trim(), pairId: index, type: 'english' });
            });

            gameTiles.sort(() => 0.5 - Math.random());

            gameTiles.forEach(tile => {
                const div = document.createElement('div');
                div.className = 'match-card';
                div.innerText = tile.text;
                div.dataset.pairId = tile.pairId;
                div.dataset.type = tile.type;
                div.onclick = () => selectTile(div);
                grid.appendChild(div);
            });
        }

        function selectTile(element) {
            if (element.classList.contains('matched') || element.classList.contains('selected')) return;

            if (!selectedElement) {
                selectedElement = element;
                element.classList.add('selected');
            } else {
                const id1 = parseInt(selectedElement.dataset.pairId, 10);
                const id2 = parseInt(element.dataset.pairId, 10);
                const type1 = selectedElement.dataset.type;
                const type2 = element.dataset.type;

                if (id1 === id2 && type1 !== type2) {
                    selectedElement.classList.remove('selected');
                    selectedElement.classList.add('matched');
                    element.classList.add('matched');
                    selectedElement = null;
                    
                    if (document.querySelectorAll('.match-card:not
